name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true

      - name: Run tests
        run: make test-go

      - name: Run integration tests
        run: go test -v -race -tags=integration ./tests/integration/...

      - name: Run E2E tests
        run: go test -v -tags=e2e ./tests/e2e/...

      - name: Run linters
        run: make lint-go

  release:
    name: Create Release with GoReleaser
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true

      - name: Install chlog
        run: go install github.com/ariel-frischer/chlog/cmd/chlog@v0.3.0

      - name: Extract release notes from CHANGELOG.yaml
        run: |
          RAW_VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          TAG="v${VERSION}"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)"
          fi

          echo "Extracting changelog for version: $VERSION"
          mkdir -p .release

          {
            echo "## autospec ${VERSION}"
            echo
            echo "**Release Date:** $(date -u +%Y-%m-%d)"
            echo
            chlog extract "$VERSION" -f internal/changelog/changelog.yaml
            echo
            echo "### Installation"
            echo
            echo "#### Using install script (recommended):"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/ariel-frischer/autospec/main/install.sh | sh"
            echo '```'
            echo
            echo "#### Manual installation:"
            echo "Download the appropriate binary for your platform from the assets below and extract it to your PATH."
            echo
            echo "### Checksums"
            echo "Verify your download using the checksums provided below."
            echo
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "---"
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
              echo
            fi
            echo "### Reporting Issues"
            echo "Found a bug or have a feature request? Please [open an issue](https://github.com/${GITHUB_REPOSITORY}/issues/new/choose)."
          } > .release/notes.md

          if ! grep -Fq "## [${VERSION}]" .release/notes.md; then
            echo "Release notes do not contain the chlog entry for version $VERSION"
            cat .release/notes.md
            exit 1
          fi

          if ! grep -Eq "^### (Added|Changed|Deprecated|Removed|Fixed|Security)$" .release/notes.md; then
            echo "Release notes do not contain changelog categories for version $VERSION"
            cat .release/notes.md
            exit 1
          fi

          echo "Release notes written to: .release/notes.md"
          cat .release/notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --release-notes=.release/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated release notes
        run: |
          RAW_VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="$RAW_VERSION"
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          VERSION="${TAG#v}"

          gh release edit "$TAG" --notes-file .release/notes.md
          gh release view "$TAG" --json body --jq '.body' > .release/published-notes.md

          if ! grep -Fq "## [${VERSION}]" .release/published-notes.md; then
            echo "Published release notes do not contain the chlog entry for version $VERSION"
            cat .release/published-notes.md
            exit 1
          fi

          if ! grep -Eq "^### (Added|Changed|Deprecated|Removed|Fixed|Security)$" .release/published-notes.md; then
            echo "Published release notes do not contain changelog categories for version $VERSION"
            cat .release/published-notes.md
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          retention-days: 7

  notify:
    name: Post-Release Notification
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Create success summary
        run: |
          echo "## Release Successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the release at: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
