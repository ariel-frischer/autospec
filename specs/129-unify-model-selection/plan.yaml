implementation_phases:
  - phase: 1
    name: "Configuration and CLI Surface"
    goal: "Expose exactly one model setting and one-shot flag."
    deliverables:
      - "Configuration.Model and Configuration.ModelOverride fields."
      - "model key in KnownKeys, default template, and runtime defaults."
      - "Shared AddModelFlag and ApplyModelOverride helpers."
      - "--model registration and override application in workflow commands."
  - phase: 2
    name: "Workflow Resolution"
    goal: "Route all supported workflow agent model selection through one resolver."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Workflow model resolver with --model > model config > default precedence."
      - "Executor.extraArgsForStage updated to apply resolved --model arguments to Claude, Codex, and OpenCode."
  - phase: 3
    name: "Docs and Polish"
    goal: "Make the simplified model selection path discoverable and validated."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Public docs updated with generic --model and model config."
      - "Manual testing plan at .dev/tasks/129-unify-model-selection.md with report summaries section."
      - "User-facing changelog entries in internal/changelog/changelog.yaml and regenerated CHANGELOG.md via make changelog-sync."
      - "Verification with make test, make fmt, make lint, and make build."

risks:
  - id: "RISK-001"
    risk: "Codex or Claude CLI model flag behavior may differ across installed versions."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Use --model because local CLI help supports it, keep automated tests focused on constructed argv, and document manual smoke tests for installed agents."
  - id: "RISK-002"
    risk: "Adding a top-level model key could conflict with future non-workflow agent configuration expectations."
    likelihood: "low"
    impact: "medium"
    mitigation: "Document the key as workflow-scoped and keep application limited to workflow Executor.extraArgsForStage."

open_questions: []

