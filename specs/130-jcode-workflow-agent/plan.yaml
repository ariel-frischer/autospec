implementation_phases:
  - phase: 1
    name: "Lock down contracts and configuration resolution"
    goal: "Define deterministic stage settings and precedence behavior before changing runtime execution."
    deliverables:
      - "Map-based tests for all supported stages, cheap profile model/route/reasoning values, profile/config/environment/CLI precedence, and effective default resolution"
      - "Configuration/default/schema/validation updates with no provider-secret or credential fields"
      - "Updated internal and public documentation for ownership and override precedence"
  - phase: 2
    name: "Extend the native jcode SDK session boundary"
    goal: "Provide the minimum typed session protocol operation for Autospec to apply route, model, and reasoning settings."
    dependencies:
      - "Phase 1"
    deliverables:
      - "SDK-facing request/response types and adapter interfaces for session-level settings"
      - "Injectable fake SDK session tests proving exact request payloads and deterministic ordering"
      - "Contextual handling for connection, authentication/provider, settings, send, and event failures"
  - phase: 3
    name: "Integrate settings into workflow execution"
    goal: "Execute every supported workflow stage through jcode when selected, applying resolved settings before prompt delivery while preserving retry behavior."
    dependencies:
      - "Phase 1"
      - "Phase 2"
    deliverables:
      - "jcode agent execution path wired through the existing cliagent.Agent and workflow executor boundaries"
      - "max reasoning for specify and plan and xhigh for all other supported stages under the cheap profile"
      - "Explicit profile and CLI overrides preserved over defaults"
      - "No credential exposure in diagnostics, logs, artifacts, or tests"
  - phase: 4
    name: "Validate, document, and polish"
    goal: "Prove the implementation is deterministic, compatible, documented, and ready for release."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Focused and package-level deterministic tests for all acceptance scenarios"
      - "Manual testing plan in .dev/tasks/130-jcode-workflow-agent.md with Report Summaries section"
      - "YAML-first changelog update followed by make changelog-sync"
      - "make test, make fmt, make lint, and make build all pass"

open_questions:
  - question: "What exact typed request names and fields does the current jcode Go SDK expose for session-level model, route, and reasoning settings?"
    context: "The current visible Go session surface includes create, attach, send, and events, while the feature requires session-level settings."
    proposed_resolution: "Confirm the sibling SDK protocol implementation during Phase 2 and add the smallest additive typed API, preserving raw protocol compatibility and fakeability."
  - question: "Is the OpenRouter openai route represented as a distinct session route field or encoded in the model/provider selection identifier?"
    context: "Cheap-profile acceptance requires both the OpenRouter openai route and openai/gpt-5.6-luna, but Autospec must not own provider configuration."
    proposed_resolution: "Use the SDK's canonical session selection representation; keep Autospec's value opaque and test the exact serialized protocol request rather than inventing a provider schema."
  - question: "Which existing fallback and init surfaces are considered the repository's effective default agent contract?"
    context: "Current docs and init helpers distinguish agent_preset from default_agents and several surfaces still describe claude as the fallback."
    proposed_resolution: "Enumerate runtime resolution, defaults template, init selection guidance, docs, and production-agent lists in Phase 1, changing only surfaces that control effective execution."

