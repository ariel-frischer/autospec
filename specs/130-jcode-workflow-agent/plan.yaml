implementation_phases:
  - phase: 1
    name: "Protocol contract and test fixtures"
    goal: "Define the SDK session-setting contract and add failing deterministic tests before production behavior changes."
    deliverables:
      - "Confirm the jcode Go SDK request/session API for provider route, model, and reasoning fields."
      - "Add injectable mock session/factory fixtures that capture settings and prompt ordering without credentials."
      - "Add map-based tests for all supported stages and expected cheap-profile policy."
  - phase: 2
    name: "Configuration and resolution policy"
    goal: "Make jcode/default/profile/override selection deterministic and preserve existing precedence."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Update agent selection and effective default resolution to select jcode where supported."
      - "Resolve cheap profile route openai, model openai/gpt-5.6-luna, max for specify/plan, and xhigh for other supported stages."
      - "Cover CLI, profile, environment, project, user, and default precedence with map-based tests."
      - "Verify no Autospec credential or provider-secret configuration fields are introduced."
  - phase: 3
    name: "Native jcode session integration"
    goal: "Transport resolved session settings through the native SDK while retaining existing workflow execution and retry semantics."
    dependencies:
      - "Phase 2"
    deliverables:
      - "Map WorkflowAgentSelection to jcode SDK session settings before sending the stage prompt."
      - "Preserve typed event streaming, TurnDone completion, permission/unknown-event handling, cleanup, timeout, and wrapped errors."
      - "Add protocol assertions for exact route, model, reasoning, working directory, and prompt behavior."
      - "Ensure jcode authentication/provider failures surface contextually without Autospec credential handling."
  - phase: 4
    name: "Configuration synchronization and documentation"
    goal: "Synchronize supported config surfaces and make the ownership boundary understandable to users and maintainers."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Update defaults template, runtime defaults, schema, validation, and relevant config tests."
      - "Update public agent/reference docs with precedence examples and jcode ownership statement."
      - "Add the manual testing plan with Report Summaries section."
      - "Add YAML-first changelog bullets and regenerate CHANGELOG.md with make changelog-sync."
  - phase: 5
    name: "Integrated validation and polish"
    goal: "Prove the feature is ready under repository quality and build gates."
    dependencies:
      - "Phase 4"
    deliverables:
      - "Run focused config, workflow, cliagent, and CLI tests with no network or real agent runtime."
      - "Run make fmt, make lint, make test, and make build."
      - "Run autospec artifact validation for changed YAML artifacts and inspect the final diff for secrets and unrelated changes."

open_questions:
  - question: "What exact jcode Go SDK type or request method should carry provider route, model, and reasoning values?"
    context: "The current local SDK exposes CreateSessionOptions with working directory only and SendOptions with images/no-reply, while the jcode runtime session model already contains these concepts."
    proposed_resolution: "During Phase 1, inspect and extend the local SDK's stable session protocol with a minimal settings payload, then use that contract from Autospec rather than encoding settings in prompts or credentials."
  - question: "Should jcode become the hardcoded fallback when agent_preset is empty, or should only repository defaults/config templates change?"
    context: "The spec requires the effective default to become jcode where the existing configuration model supports an agent default, but explicit production-build behavior and compatibility fallbacks must not be broken."
    proposed_resolution: "Prefer changing the existing supported default and its tests to jcode, with an explicit compatibility path only where the build or runtime cannot register jcode; document any unchanged unsupported surface instead of inventing a new one."
  - question: "Where should the cheap profile be materialized: checked-in profile fixture, generated profile example, or only resolution constants/tests?"
    context: "The repository supports user/project named profile overlays but does not currently contain a checked-in cheap profile."
    proposed_resolution: "Implement and test the policy in profile resolution and add a documented example or fixture only if existing profile conventions support repository-owned profiles; do not create credentials or mutate user config."

