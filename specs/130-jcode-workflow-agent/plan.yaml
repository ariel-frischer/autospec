plan:
  branch: "130-jcode-workflow-agent"
  created: "2026-08-06"
  spec_path: "specs/130-jcode-workflow-agent/spec.yaml"

summary: |
  Extend the existing native jcode adapter and workflow configuration path so jcode
  is a first-class workflow agent for every supported stage. The implementation will
  resolve the effective agent, cheap profile values, stage-specific reasoning, and
  model settings before execution, then pass those values through the jcode Go SDK
  session protocol. Existing profile, environment, project, and CLI precedence will
  remain intact, while provider selection, authentication, and credentials remain
  entirely inside jcode.

  The work will preserve the existing cliagent.Agent boundary and deterministic mock
  factory pattern. The jcode SDK boundary will expose the minimum session-level
  settings operation needed by Autospec, without adding provider-secret fields to
  Autospec configuration. Tests will cover all supported stages, precedence cases,
  protocol requests, contextual SDK failures, and default resolution. Documentation
  will explain the ownership boundary and supported overrides.

technical_context:
  language: "Go 1.25+"
  framework: "Cobra CLI with internal workflow and cliagent packages"
  primary_dependencies:
    - name: "github.com/1jehuang/jcode-go"
      version: "v0.0.0 (local replace ../jcode/sdk/go)"
      purpose: "Native jcode runtime connection, session creation, session settings, prompt delivery, and event streaming"
    - name: "github.com/knadh/koanf/v2"
      version: "v2.3.0"
      purpose: "Existing layered configuration loading and environment precedence"
    - name: "gopkg.in/yaml.v3"
      version: "v3.0.1"
      purpose: "Existing profile and artifact parsing in tests and configuration tooling"
    - name: "github.com/stretchr/testify"
      version: "v1.11.1"
      purpose: "Existing deterministic assertions and test helpers"
  storage: "YAML configuration and named profile files; jcode-owned runtime/provider storage remains outside Autospec"
  testing:
    framework: "Go testing with testify where already used"
    approach: "Map-based unit tests for selection and precedence, protocol-level fake SDK tests for jcode sessions, package integration tests for workflow execution, and isolated temporary configuration directories; no network, credentials, real agent runtime, or active-repository mutation"
  target_platform: "Linux, macOS, and Windows environments supported by the Go CLI and jcode SDK"
  project_type: "cli"
  performance_goals: "Configuration loading under 100ms; validation and resolution paths under 10ms where applicable; no extra network or runtime startup during configuration resolution"
  constraints:
    - "Do not add Autospec-owned jcode provider, API key, token, or authentication fields"
    - "Preserve explicit CLI and named-profile overrides over effective defaults"
    - "Keep command templates agent-neutral"
    - "Use the native jcode Go SDK rather than an Autospec-owned provider integration"
    - "Functions under 40 lines and contextual error wrapping in changed Go code"
    - "All new selection and protocol tests use map[string]struct table cases"
    - "Run make test, make fmt, make lint, and make build before completion"
  scale_scope: "One local Autospec process orchestrating the existing constitution, specify, clarify, plan, tasks, checklist, analyze, and implement stages through one jcode SDK session per execution"

