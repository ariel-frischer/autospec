research_findings:
  decisions:
    - topic: "Native jcode integration boundary"
      decision: "Keep the integration in internal/cliagent/jcode.go and expose only a narrow injected factory/session boundary to workflow tests."
      rationale: "The repository already registers Jcode as a native Agent and uses interfaces for deterministic execution. This prevents workflow code from depending directly on the concrete jcode client."
      alternatives_considered:
        - "Invoke a jcode CLI or jcode run wrapper"
        - "Add provider-specific logic directly to internal/workflow.Executor"
    - topic: "Session-level model and reasoning transport"
      decision: "Extend the local jcode Go SDK session protocol with explicit session-setting fields for route/provider reference, model, and reasoning effort, then map Autospec's resolved stage selection into that request."
      rationale: "The current SDK SendOptions only carries images and no-reply flags, while jcode session state already models model, route, and reasoning concepts. Session-level transport satisfies the ownership boundary without duplicating credentials."
      alternatives_considered:
        - "Encode settings into the prompt text"
        - "Pass settings as CLI arguments or environment variables"
        - "Have Autospec own OpenRouter credentials and provider configuration"
    - topic: "Agent and stage support"
      decision: "Use the existing workflow Stage constants and registered-agent resolution as the source of truth, covering constitution, specify, clarify, plan, tasks, checklist, analyze, and implement where supported."
      rationale: "This avoids inventing a second stage registry and keeps reasoning policy aligned with the existing Executor call path."
      alternatives_considered:
        - "Create a separate jcode-only stage list"
        - "Limit the feature to specify, plan, tasks, and implement"
    - topic: "Cheap profile policy"
      decision: "Define the cheap profile as jcode with route reference openai, model openai/gpt-5.6-luna, max for specify and plan, and xhigh for all other supported stages."
      rationale: "This directly matches the feature contract while using existing profile layering and stage-specific model/reasoning structures."
      alternatives_considered:
        - "Use the existing Codex-only reasoning flag path"
        - "Use one global reasoning effort for every stage"
    - topic: "Configuration ownership and precedence"
      decision: "Retain existing environment > project > user > defaults layering, profile overlays, and CLI overrides; add no jcode credential fields. Document CLI override > profile/config > effective default for agent and session settings."
      rationale: "The existing config loader and shared CLI helpers already implement the required precedence and can be extended without changing ownership boundaries."
      alternatives_considered:
        - "Introduce a separate jcode credential/provider config section"
        - "Let cheap profile values override explicit CLI flags"

data_model:
  entities:
    - name: "WorkflowAgentSelection"
      description: "Resolved agent and session-level settings for one Autospec workflow stage."
      fields:
        - name: "agent"
          type: "string"
          description: "Registered workflow agent name, including jcode"
          constraints: "Must resolve through the existing agent registry and preserve explicit overrides"
        - name: "stage"
          type: "workflow.Stage"
          description: "Canonical workflow stage being executed"
          constraints: "Must be one of the existing supported stage constants"
        - name: "route"
          type: "string"
          description: "Provider route reference passed to jcode, not a credential"
          constraints: "Opaque session value; empty unless selected by config/profile"
        - name: "model"
          type: "string"
          description: "Session model identifier"
          constraints: "CLI override > stage profile/config > top-level config > default"
        - name: "reasoning"
          type: "string"
          description: "Stage reasoning effort"
          constraints: "CLI override > stage profile/config > top-level config > policy/default"
    - name: "JcodeSessionSettings"
      description: "SDK protocol payload carrying Autospec's session-level request without provider secrets."
      fields:
        - name: "provider_route"
          type: "string"
          description: "Opaque jcode provider route selection"
          constraints: "Must not contain or represent credentials"
        - name: "model"
          type: "string"
          description: "Requested model identifier"
          constraints: "Opaque to Autospec"
        - name: "reasoning_effort"
          type: "string"
          description: "Requested reasoning policy"
          constraints: "Validated by jcode or provider runtime, not by Autospec credential logic"
      relationships:
        - target: "WorkflowAgentSelection"
          type: "one-to-one"
          description: "One resolved stage selection produces one jcode session settings payload"
    - name: "Jcode SDK Session"
      description: "Native jcode runtime session that owns provider/authentication behavior and emits typed events."
      fields:
        - name: "working_directory"
          type: "string"
          description: "Autospec workflow working directory"
          constraints: "Passed through existing session creation path"
        - name: "settings"
          type: "JcodeSessionSettings"
          description: "Session-level selection request"
          constraints: "Contains no provider secrets"
      relationships:
        - target: "JcodeSessionSettings"
          type: "one-to-one"
          description: "Session receives settings before prompt execution"

