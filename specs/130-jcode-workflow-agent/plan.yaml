research_findings:
  decisions:
    - topic: "Native jcode integration boundary"
      decision: "Keep jcode behind internal/cliagent.Agent and extend the SDK-facing adapter/factory only for session-level settings needed by workflow execution."
      rationale: "The repository already has cliagent/jcode.go, a local jcode-go dependency, connect/private runtime modes, and injectable factory interfaces. This avoids a second provider implementation and keeps agent-specific coupling in cliagent."
      alternatives_considered:
        - "Implement jcode as a command-backed BaseAgent"
        - "Add a separate Autospec provider/authentication subsystem"
        - "Call undocumented SDK internals directly from workflow"
    - topic: "Model and reasoning delivery"
      decision: "Resolve stage settings in Autospec, then send model and reasoning through typed/native jcode session protocol requests before sending the stage prompt."
      rationale: "The spec assigns workflow-stage selection to Autospec but provider/auth ownership to jcode. The SDK already models sessions and typed events, so the minimum additive session API is the appropriate boundary."
      alternatives_considered:
        - "Encode settings into the prompt"
        - "Pass provider credentials or provider config through Autospec"
        - "Use CLI flags or environment variables around the jcode runtime"
    - topic: "Cheap profile values"
      decision: "Use the existing named profile overlay and precedence machinery, setting agent_preset to jcode, model to openai/gpt-5.6-luna, the OpenRouter openai route as a session-level selection value, max for specify/plan, and xhigh for other supported stages."
      rationale: "Existing profile tests demonstrate profile overlays and environment precedence. Extending the established model/reasoning structures preserves compatibility and makes the policy table-testable."
      alternatives_considered:
        - "Create a special hard-coded cheap-profile code path"
        - "Add provider credentials to the cheap profile"
        - "Apply one reasoning value to every stage"
    - topic: "Effective default agent"
      decision: "Change only existing effective-default surfaces that currently fall back to claude, including runtime resolution, generated defaults, init guidance, and relevant docs/tests; do not invent a new config field."
      rationale: "The spec explicitly limits the default change to supported configuration surfaces, while current docs and init behavior still describe claude as the fallback."
      alternatives_considered:
        - "Add a second default-agent configuration field"
        - "Change default_agents, which only controls init checkbox selection"
        - "Leave runtime fallback unchanged"
    - topic: "Failure and secret handling"
      decision: "Wrap SDK connect, settings, send, and event failures with stage and operation context, while diagnostics expose only safe setting identifiers and never credentials."
      rationale: "This meets the security boundary and lets users distinguish missing jcode authentication from workflow validation failures without Autospec collecting or persisting secrets."
      alternatives_considered:
        - "Retry authentication inside Autospec"
        - "Persist SDK error payloads wholesale"
        - "Silently fall back to another provider"

data_model:
  entities:
    - name: "Workflow agent selection"
      description: "Resolved agent and session-level settings for one workflow stage after defaults, profile, environment, and CLI precedence."
      fields:
        - name: "agent"
          type: "string"
          description: "Selected workflow agent name, including jcode"
          constraints: "Must be a registered supported agent"
        - name: "profile"
          type: "string"
          description: "Optional named profile contributing configuration"
          constraints: "Validated profile basename; empty when no profile is selected"
        - name: "stage"
          type: "workflow.Stage"
          description: "Constitution, specify, clarify, plan, tasks, checklist, analyze, or implement"
          constraints: "Must be a currently supported stage"
        - name: "route"
          type: "string"
          description: "Session-level provider route reference, such as OpenRouter openai"
          constraints: "Selection identifier only; must not contain credentials"
        - name: "model"
          type: "string"
          description: "Session-level model identifier"
          constraints: "CLI override wins over profile/stage/config/default values"
        - name: "reasoning"
          type: "string"
          description: "Stage-specific reasoning effort"
          constraints: "max for specify and plan in cheap profile; xhigh for other supported stages"
      relationships:
        - target: "jcode SDK session"
          type: "one-to-one"
          description: "One resolved stage selection configures one native jcode session"
    - name: "jcode SDK session"
      description: "Native jcode session used to apply settings, send the rendered workflow prompt, and stream output events."
      fields:
        - name: "session_id"
          type: "string"
          description: "Runtime-assigned jcode session identifier"
          constraints: "Owned by jcode; Autospec does not persist credentials"
        - name: "session_settings"
          type: "struct"
          description: "Model, route, and reasoning requests sent through the SDK protocol"
          constraints: "Must be deterministic and applied before prompt delivery"
        - name: "events"
          type: "typed event stream"
          description: "Text, reasoning, tool, error, and turn completion events"
          constraints: "Closed on completion or failure"
      relationships:
        - target: "Workflow agent selection"
          type: "many-to-one"
          description: "Session is created from one stage selection"

