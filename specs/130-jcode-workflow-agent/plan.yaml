plan:
  branch: "130-jcode-workflow-agent"
  created: "2026-08-06"
  spec_path: "specs/130-jcode-workflow-agent/spec.yaml"

summary: |
  Extend the existing native jcode agent path so Autospec resolves jcode as the
  effective supported default where the configuration model permits it, while
  preserving explicit CLI, profile, environment, and custom-agent precedence.
  The workflow layer will resolve stage settings into a provider-route reference,
  model, and reasoning effort, then pass those values through the jcode Go SDK
  session protocol. Autospec will not add provider credentials, API keys, or
  authentication state. The SDK and its protocol boundary remain responsible for
  provider selection and authentication owned by jcode.

  The implementation will build on the existing cliagent.Jcode, config.JcodeConfig,
  workflow model-selection helpers, and Executor interface seams. Tests will use
  injected SDK factories and session/event fakes, plus map-based configuration and
  stage tables, so no network, real jcode runtime, provider credentials, or real
  agent CLI is required. Documentation will make ownership and precedence explicit,
  and the final validation will run the repository's required format, lint, test,
  and build targets.

technical_context:
  language: "Go 1.25+"
  framework: "Cobra CLI with internal workflow and cliagent packages"
  primary_dependencies:
    - name: "github.com/1jehuang/jcode-go"
      version: "local module replacement ../jcode/sdk/go"
      purpose: "Native jcode client, session, typed-event, and session-setting protocol"
    - name: "github.com/knadh/koanf/v2"
      version: "v2.3.0"
      purpose: "Hierarchical configuration loading and environment/profile precedence"
    - name: "github.com/stretchr/testify"
      version: "v1.11.1"
      purpose: "Assertions for deterministic unit and package integration tests"
    - name: "gopkg.in/yaml.v3"
      version: "v3.0.1"
      purpose: "Configuration and artifact parsing used by existing validation tests"
  storage: "Existing YAML configuration files and jcode-owned runtime/auth storage; no new Autospec credential storage"
  testing:
    framework: "Go testing with map[string]struct table cases and injected interfaces"
    approach: "Unit tests for resolution and protocol mapping; package integration tests for Executor/Jcode adapter; isolated CLI/config tests; no network or real agent execution"
  target_platform: "Linux, macOS, and Windows Go CLI builds supported by the repository"
  project_type: "cli"
  performance_goals: "Configuration resolution under the existing <100ms config-loading target; artifact validation remains under 10ms; session setting resolution is deterministic and in-memory"
  constraints:
    - "Provider selection, authentication, and credentials remain owned by jcode"
    - "Do not add Autospec-owned jcode secrets, API keys, tokens, or provider configuration"
    - "Preserve CLI, profile, environment, custom-agent, and existing model/reasoning precedence"
    - "Keep command templates agent-neutral"
    - "Use lifecycle wrappers for workflow commands and deterministic mocks for agent tests"
    - "Keep changed functions under 40 lines and wrap contextual errors"
  scale_scope: "One local Autospec process invoking one jcode SDK session per workflow stage; all currently registered workflow stages must resolve consistently"

