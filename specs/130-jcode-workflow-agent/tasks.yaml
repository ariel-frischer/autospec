    phases: [1, 2, 3]
    description: "Setup, protocol/resolution foundation, and native jcode execution for all supported stages."
    validation: "Run deterministic stage-selection and executor tests with injected SDK fakes, then verify default and explicit override behavior."
  incremental_delivery:
    - milestone: "Foundation Ready"
      phases: [1, 2]
      deliverable: "A tested, non-secret session-settings boundary and complete stage/policy fixtures are ready for implementation."
    - milestone: "MVP Complete"
      phases: [1, 2, 3]
      deliverable: "All supported workflow stages can execute through native jcode with default and explicit selection behavior."
    - milestone: "Policy Complete"
      phases: [1, 2, 3, 4, 5]
      deliverable: "Cheap-profile settings, provider ownership boundary, protocol failures, and deterministic precedence behavior are implemented."
    - milestone: "Release Ready"
