feature:
  branch: "130-jcode-workflow-agent"
  created: "2026-08-06"
  status: "Draft"
  input: "Use the native jcode Go SDK as Autospec's main workflow agent. Make the requested cheap profile select jcode with OpenRouter's openai route and model openai/gpt-5.6-luna, using max reasoning for specify and plan and xhigh for every other supported stage. Apply model and reasoning settings through the native jcode SDK session protocol without making Autospec own jcode provider or credential configuration. Keep provider/auth configuration in jcode, document the ownership boundary, preserve explicit profile and CLI overrides, add deterministic tests, and update the repository's effective default agent to jcode where configuration supports it."

user_stories:
  - id: "US-001"
    title: "Use jcode as the primary workflow agent"
    priority: "P1"
    as_a: "Autospec user"
    i_want: "workflow stages to execute through the native jcode Go SDK"
    so_that: "I can use jcode's supported agent runtime as Autospec's main workflow agent without a separate Autospec-owned provider integration"
    why_this_priority: "This is the core capability and affects every supported workflow stage."
    independent_test: "Run each supported workflow stage with a deterministic jcode SDK test double and verify the expected session interaction."
    acceptance_scenarios:
      - given: "The effective default agent is configured as jcode"
        when: "A user runs a workflow without an explicit agent override"
        then: "Autospec selects the native jcode SDK agent path."
      - given: "A user has an explicit agent profile or CLI agent override"
        when: "The workflow starts"
        then: "The explicit override takes precedence over the effective default."

  - id: "US-002"
    title: "Apply the cheap profile model and reasoning policy"
    priority: "P1"
    as_a: "Autospec user"
    i_want: "the cheap profile to select jcode with OpenRouter's openai route and openai/gpt-5.6-luna"
    so_that: "specification and planning use max reasoning while all other supported stages use xhigh reasoning consistently"
    why_this_priority: "The profile's model and reasoning policy is a stated compatibility and cost-control requirement."
    independent_test: "Resolve the cheap profile for each stage and assert the session protocol receives the expected model and reasoning values."
    acceptance_scenarios:
      - given: "The cheap profile is active for specify or plan"
        when: "Autospec creates the jcode session"
        then: "The session receives the OpenRouter openai route, model openai/gpt-5.6-luna, and max reasoning."
      - given: "The cheap profile is active for another supported stage"
        when: "Autospec creates the jcode session"
        then: "The session receives the OpenRouter openai route, model openai/gpt-5.6-luna, and xhigh reasoning."

  - id: "US-003"
    title: "Keep provider ownership in jcode"
    priority: "P1"
    as_a: "Autospec maintainer"
    i_want: "Autospec to pass model and reasoning settings through the native jcode SDK session protocol"
    so_that: "provider selection, authentication, and credentials remain owned and configured by jcode"
    why_this_priority: "Duplicating provider or credential configuration would create a security and maintenance boundary violation."
    independent_test: "Inspect the jcode adapter configuration surface and verify deterministic tests never require Autospec provider credentials or duplicate credential fields."
    acceptance_scenarios:
      - given: "jcode owns provider and authentication configuration"
        when: "Autospec starts a workflow session"
        then: "Autospec sends session-level model and reasoning settings without taking ownership of provider credentials."
      - given: "The jcode SDK reports a provider or authentication failure"
        when: "The workflow handles the failure"
        then: "Autospec surfaces contextual failure information without storing or rewriting credentials."

  - id: "US-004"
    title: "Document and verify configuration precedence"
    priority: "P1"
    as_a: "Autospec user and maintainer"
    i_want: "the ownership boundary and precedence rules to be documented and tested"
    so_that: "defaults remain predictable while explicit profile and CLI overrides continue to work"
    why_this_priority: "Users must be able to override defaults safely, and maintainers need a durable integration contract."
    independent_test: "Run table-driven precedence cases covering effective defaults, named profiles, and CLI overrides with a mock session."
    acceptance_scenarios:
      - given: "The repository supports an effective default agent setting"
        when: "Configuration is loaded without overrides"
        then: "The effective default agent is jcode where supported."
      - given: "A named profile or CLI override specifies another supported agent or setting"
        when: "Configuration is resolved"
        then: "The explicit profile or CLI value wins over the default."

requirements:
  functional:
    - id: "FR-001"
      description: "MUST provide a native jcode Go SDK workflow agent integration for all currently supported Autospec workflow stages."
      acceptance_criteria: "Deterministic tests confirm each supported stage selects and invokes the jcode SDK integration without calling a real external agent."
    - id: "FR-002"
      description: "MUST configure the cheap profile to select jcode with OpenRouter's openai route and model openai/gpt-5.6-luna."
      acceptance_criteria: "Cheap-profile resolution tests assert the selected agent, route, and model for every supported stage."
    - id: "FR-003"
      description: "MUST apply max reasoning for specify and plan, and xhigh reasoning for every other supported stage, through the native jcode SDK session protocol."
      acceptance_criteria: "Protocol-level mock tests assert the exact reasoning value sent for each stage and reject stage-specific drift."
    - id: "FR-004"
      description: "MUST keep jcode provider and authentication configuration outside Autospec-owned configuration."
      acceptance_criteria: "Configuration schema and documentation contain no Autospec-owned jcode credential or provider-secret fields, and tests verify session settings are passed without them."
    - id: "FR-005"
      description: "MUST preserve explicit profile and CLI overrides over the effective default agent and cheap-profile settings."
      acceptance_criteria: "Map-based precedence tests verify CLI overrides win over profile values and profile values win over defaults."
    - id: "FR-006"
      description: "MUST update the repository's effective default agent to jcode wherever the existing configuration model supports an agent default."
      acceptance_criteria: "Default configuration, runtime resolution, and relevant documentation tests assert jcode as the effective default without changing unsupported configuration surfaces."
    - id: "FR-007"
      description: "MUST document the boundary that jcode owns provider selection, authentication, and credentials while Autospec owns workflow-stage selection and session-level model/reasoning requests."
      acceptance_criteria: "Public or internal configuration documentation contains the ownership statement and override precedence examples."
    - id: "FR-008"
      description: "MUST include deterministic map-based table tests for agent selection, stage reasoning, protocol requests, configuration precedence, and default resolution."
      acceptance_criteria: "The relevant test packages pass without network access, real agent CLIs, provider credentials, or mutation of the developer repository."
    - id: "FR-009"
      description: "MUST require make test, make fmt, make lint, and make build to pass before completion."
      acceptance_criteria: "Each required command exits with status 0 on the completed implementation."

  non_functional:
    - id: "NFR-001"
      category: "security"
      description: "Provider and authentication secrets MUST remain in jcode configuration and MUST NOT be copied into Autospec configuration, artifacts, logs, or tests."
      measurable_target: "Zero new Autospec credential fields, secret fixtures, or emitted secret values."
    - id: "NFR-002"
      category: "reliability"
      description: "Agent selection and session-setting resolution MUST be deterministic and safe to retry."
      measurable_target: "Repeated resolution with identical inputs produces identical protocol requests in 100% of table-driven test cases."
    - id: "NFR-003"
      category: "code_quality"
      description: "Functions MUST remain under 40 lines and errors MUST be wrapped with context."
      measurable_target: "Implementation review and lint checks find no functions over 40 lines or bare contextual error returns in changed code."
    - id: "NFR-004"
      category: "code_quality"
      description: "Tests MUST use map-based table cases and boundaries MUST accept interfaces while returning concrete types where appropriate."
      measurable_target: "All new selection and protocol tests use map[string]struct cases and all required validation commands pass."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Users can run every supported workflow stage through the native jcode agent path when no explicit override is supplied."
      metric: "Supported stages resolving to jcode under the effective default"
      target: "100% of supported stages"
    - id: "SC-002"
      description: "The cheap profile consistently applies the requested model and stage-specific reasoning policy."
      metric: "Protocol requests matching expected route, model, and reasoning"
      target: "100% of deterministic test cases"
    - id: "SC-003"
      description: "Users can override the default behavior with explicit profile and CLI settings."
      metric: "Precedence scenarios retaining the explicit setting"
      target: "100% of documented precedence cases"
    - id: "SC-004"
      description: "Maintainers can identify which system owns provider and authentication configuration."
      metric: "Ownership-boundary documentation and review checklist coverage"
      target: "One documented boundary statement with tested examples"

key_entities:
  - name: "Workflow agent selection"
    description: "The resolved agent and session settings used for one Autospec workflow stage."
    attributes:
      - "agent"
      - "profile"
      - "stage"
      - "model"
      - "reasoning"
  - name: "jcode SDK session"
    description: "The native jcode protocol session through which Autospec requests stage execution."
    attributes:
      - "session settings"
      - "provider route reference"
      - "authentication ownership"

edge_cases:
  - scenario: "A user supplies a CLI override that conflicts with the cheap profile."
    expected_behavior: "The explicit CLI override wins and the resolved values are visible in deterministic diagnostics without exposing credentials."
  - scenario: "A stage is not supported by the stage-specific reasoning policy."
    expected_behavior: "Autospec preserves existing supported-stage behavior and fails with a contextual validation error rather than silently selecting an invalid reasoning value."
  - scenario: "jcode provider authentication is missing or invalid."
    expected_behavior: "The workflow reports a contextual jcode error and does not prompt Autospec to collect or persist provider credentials."
  - scenario: "The repository has no configuration surface for an effective default agent."
    expected_behavior: "Autospec changes only supported configuration surfaces and documents the unchanged boundary rather than inventing a new credential or provider configuration model."

assumptions:
  - "The native jcode Go SDK exposes a session protocol capable of receiving model and reasoning settings per workflow session."
  - "OpenRouter's openai route and the openai/gpt-5.6-luna model are represented as session-level selection values rather than Autospec-owned credentials."
  - "Existing Autospec configuration precedence remains environment, project, user, and defaults unless an explicit profile or CLI override contract already supersedes it."
  - "Supported stages means the stages already recognized by the repository's agent orchestration layer."
  - "Deterministic tests use mocks or protocol fakes and do not require network access or real jcode authentication."

constraints:
  - "Do not add Autospec-owned jcode provider, API key, token, or authentication configuration."
  - "Do not break existing explicit profile or CLI overrides."
  - "Keep command templates agent-neutral and avoid provider-specific secrets or MCP-only behavior."
  - "Follow the repository's validation-first, test-first, configuration-consistency, and lifecycle requirements."

out_of_scope:
  - "Implementing or changing jcode's provider authentication, credential storage, or OpenRouter account configuration."
  - "Adding new workflow stages unrelated to agent selection and session settings."
  - "Changing the jcode SDK's public protocol or owning a fork of its provider implementation."
  - "Executing live workflows against OpenRouter or real jcode credentials as part of automated tests."

