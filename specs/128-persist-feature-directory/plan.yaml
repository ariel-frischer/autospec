    - name: "Workflow Lifecycle and Auditability"
      status: "PASS"
      notes: "Workflow commands keep lifecycle.RunWithHistory wrappers, and task generation must include manual testing and changelog tasks."

research_findings:
  decisions:
    - topic: "Active feature resolution precedence"
      decision: "Use explicit command selection first, persisted active feature state second, and existing branch-prefix/recent fallback last."
      rationale: "This satisfies explicit automation needs while preserving current behavior for users who never persist a feature."
      alternatives_considered:
        - "Make persisted state override --spec, which would surprise scripts and existing users."
        - "Replace branch detection entirely, which would break established feature-branch workflows."
    - topic: "State location"
      decision: "Store active feature selection in project-local .autospec/state rather than global config."
      rationale: "The spec states this is project scope; the existing repository already uses .autospec/state for worktree state and runtime notices."
      alternatives_considered:
        - "Add a config field, which would drift into user preference semantics and require schema/default documentation updates."
        - "Use only environment variables, which would not persist across later invocations."
    - topic: "Resolver implementation boundary"
      decision: "Introduce a focused resolver API around internal/spec instead of duplicating precedence logic in each Cobra command."
      rationale: "Centralizing resolution keeps plan/tasks/status/artifact behavior consistent and makes selection-source reporting testable."
      alternatives_considered:
        - "Patch each command independently, which risks inconsistent precedence and error messages."
        - "Move all CLI workflow logic into spec, which would over-couple domain lookup with Cobra command behavior."
    - topic: "State format"
      decision: "Use a small YAML document with feature_directory, selection_source, and updated_at fields."
      rationale: "YAML matches autospec artifact/config conventions and is easy for users to inspect when debugging."
      alternatives_considered:
        - "JSON state, which is used for legacy config but is less aligned with current YAML-first project direction."
        - "Plain text path only, which would not preserve source or timestamp for explainable status output."

data_model:
  entities:
    - name: "Active Feature Directory"
      description: "The spec directory selected for workflow commands."
      fields:
        - name: "directory"
          type: "string"
          description: "Path to a feature directory under the configured specs_dir."
          constraints: "Must exist, be a directory, and contain required artifacts for the requested stage."
        - name: "number"
          type: "string"
          description: "Three-digit feature prefix parsed from the directory basename."
          constraints: "Matches ^[0-9]{3}$."
        - name: "name"
          type: "string"
          description: "Feature slug parsed from the directory basename."
          constraints: "Non-empty slug matching existing spec directory naming."
        - name: "selection_source"
          type: "enum"
          description: "Where the active feature selection came from."
          constraints: "One of explicit, persisted, git_branch, fallback, env_var if retained."
      relationships:
        - target: "Persisted Feature State"
          type: "one-to-one"
          description: "Persisted state records the active feature directory for later resolution."
    - name: "Persisted Feature State"
      description: "Project-local state file recording the active feature directory."
      fields:
        - name: "feature_directory"
          type: "string"
          description: "Relative feature directory path or basename to resolve under specs_dir."
          constraints: "Must not escape specs_dir; invalid values produce actionable errors."
        - name: "updated_at"
          type: "timestamp"
          description: "UTC timestamp for the last state update."
          constraints: "ISO 8601 string."
        - name: "source"
          type: "string"
          description: "Operation that persisted the selection."
          constraints: "Human-readable source such as specify, select, or explicit."
      relationships:
        - target: "Active Feature Directory"
          type: "one-to-one"
          description: "State resolves to exactly one active feature directory."
    - name: "Feature Selection Override"
      description: "An explicit user request to target a specific feature for one invocation."
      fields:
        - name: "identifier"
          type: "string"
          description: "Feature number, slug, or full directory basename accepted by existing spec lookup."
          constraints: "Validated through existing GetSpecMetadata/GetSpecDirectory behavior."
        - name: "scope"
          type: "string"
          description: "Whether the override is one-shot or should update persisted state."
          constraints: "Default one-shot unless an explicit select/persist action is used."
      relationships:
        - target: "Active Feature Directory"
          type: "many-to-one"
          description: "Many possible override identifiers can resolve to one feature directory."

api_contracts:
  endpoints: []
  cli_commands:
    - command: "autospec run --spec <feature>"
      description: "Existing explicit selection remains higher priority than persisted active feature state."
      request:
        arguments:
          - name: "feature"
            type: "string"
            required: true
      response:
        success: "Targets the requested feature and reports explicit selection."
        errors:
          - code: 3
            description: "Requested feature is missing, ambiguous, or lacks required artifacts."
    - command: "autospec status [feature]"
      description: "Shows the resolved active feature and selection source, using persisted state when no argument is provided."
      request:
        arguments:
          - name: "feature"
            type: "string"
            required: false
      response:
        success: "Displays artifacts, task summary, and active feature source."
        errors:
          - code: 3
            description: "Persisted state is invalid or no feature can be resolved."

