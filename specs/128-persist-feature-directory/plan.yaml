implementation_phases:
  - phase: 1
    name: "Resolver Contract and Tests"
    goal: "Define and test active feature resolution behavior before production changes."
    deliverables:
      - "Map-based table tests for explicit, persisted, branch-derived, and fallback resolution."
      - "Tests for missing directory, missing spec.yaml, ambiguous feature identifier, and deleted persisted state."
      - "Selection-source expectations for status/error output."
  - phase: 2
    name: "Persisted State and Shared Resolver"
    goal: "Implement project-local active feature state and centralize precedence logic."
    dependencies:
      - "Phase 1"
    deliverables:
      - "Small YAML state type with load, save, clear, and validate helpers."
      - "Resolver API that returns spec.Metadata plus selection source and actionable errors."
      - "Persistence after creating or explicitly selecting a feature where appropriate."
  - phase: 3
    name: "Command Integration"
    goal: "Route affected commands through the shared resolver while preserving current command lifecycle wrappers."
    dependencies:
      - "Phase 2"
    deliverables:
      - "run, plan, tasks, implement, status, and artifact type-only lookup use the shared resolver."
      - "--spec and positional explicit selections keep higher precedence than persisted state."
      - "Output identifies the active feature directory and selection source."
  - phase: 4
    name: "Documentation and Release Notes"
    goal: "Explain the feature for users and make it visible in release artifacts."
    dependencies:
      - "Phase 3"
    deliverables:
      - "Public docs covering resolution order, explicit selection, persisted state, branch fallback, and worktree limitations."
      - "Changelog YAML entry and regenerated CHANGELOG.md."
      - "Manual testing plan under .dev/tasks/."
  - phase: 5
    name: "Validation"
    goal: "Run required project validation and fix regressions."
    dependencies:
      - "Phase 4"
    deliverables:
      - "make fmt exits 0."
      - "make test exits 0."
      - "make lint exits 0."
      - "make build exits 0."

risks:
  - id: "RISK-001"
    risk: "Persisted state may unexpectedly override a user's current branch if stale."
    likelihood: "medium"
    impact: "medium"
    mitigation: "Always report selection source and make invalid persisted state produce clear corrective guidance."
  - id: "RISK-002"
    risk: "Resolution logic may diverge across commands if each command handles precedence separately."
    likelihood: "medium"
    impact: "high"
    mitigation: "Use a shared resolver API and command-level regression tests for representative entry points."
  - id: "RISK-003"
    risk: "Persisted paths could escape specs_dir or reference deleted directories."
    likelihood: "low"
    impact: "high"
    mitigation: "Normalize and validate persisted values against specs_dir before returning metadata."

open_questions:
  - question: "Should explicit --spec update persisted active feature state or remain strictly one-shot?"
    context: "The spec says explicit selection wins, but persistence semantics for every explicit invocation could surprise users."
    proposed_resolution: "Keep --spec one-shot by default and persist only after feature creation or an explicit select/persist action, unless existing command behavior clearly implies selection should become active."
  - question: "Should there be a dedicated command for setting or clearing the active feature?"
    context: "Users may need to recover from stale persisted state without editing YAML by hand."
    proposed_resolution: "Prefer a small command or flag such as autospec feature select/clear if it fits existing command structure; otherwise document the state file and provide actionable error hints."

