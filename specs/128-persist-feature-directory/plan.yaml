plan:
  branch: "128-persist-feature-directory"
  created: "2026-05-14"
  spec_path: "specs/128-persist-feature-directory/spec.yaml"

summary: |
  Implement active feature directory persistence as project-local workflow state, layered into the existing spec resolution path without replacing branch-prefix or --spec behavior. The resolver should apply a deterministic precedence order: explicit command selection, persisted active feature directory, then existing branch-prefix detection and current fallback behavior.

  The change should stay close to the current Go CLI architecture: add focused state and resolver helpers under internal/spec or an adjacent state package, wire shared command entry points through that resolver, and update user-facing docs so multi-worktree users understand that autospec can share one feature directory across differently named branches while Git still prevents checking out the same branch in multiple worktrees.

technical_context:
  language: "Go 1.25.1 module, currently tested with Go 1.26.1"
  framework: "Cobra CLI v1.10.1"
  primary_dependencies:
    - name: "gopkg.in/yaml.v3"
      version: "v3.0.1"
      purpose: "Parse and write project-local YAML state while matching existing artifact/config conventions."
    - name: "github.com/spf13/cobra"
      version: "v1.10.1"
      purpose: "Expose explicit feature selection flags or arguments across workflow commands."
    - name: "github.com/stretchr/testify"
      version: "v1.11.1"
      purpose: "Focused assertions for map-based table tests."
  storage: "Project-local YAML state under .autospec/state, likely .autospec/state/active-feature.yaml"
  testing:
    framework: "Go testing with testify"
    approach: "Test-first unit coverage for resolver precedence and state persistence, plus CLI command tests for --spec and persisted-state behavior."
  target_platform: "Linux, macOS, Windows"
  project_type: "cli"
  performance_goals: "Spec resolution remains filesystem-only and comfortably below the repository's <10ms validation-state performance target."
  constraints:
    - "Preserve existing --spec override behavior as the highest-priority user selection."
    - "Fall back to existing branch-prefix detection when no explicit or persisted selection exists."
    - "Persist active feature state per project, not as a global user preference."
    - "Do not change spec.yaml, plan.yaml, or tasks.yaml artifact schemas."
    - "Keep new and changed production functions under 40 lines with contextual error wrapping."
    - "Document Git's unchanged same-branch worktree restriction."
  scale_scope: "One active feature selection per project worktree, resolving among the existing specs directory entries."

