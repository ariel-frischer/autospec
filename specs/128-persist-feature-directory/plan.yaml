  constitution_path: ".autospec/constitution.yaml"
  gates:
    - name: "Validation-First Workflow"
      status: "PASS"
      notes: "Plan preserves stage prerequisite checks and requires artifact validation for generated plan/tasks outputs."
    - name: "Test-First Development"
      status: "PASS"
      notes: "Implementation starts with resolver/state tests and observable CLI command tests before production wiring."
    - name: "Performance Standards"
      status: "PASS"
      notes: "Resolution uses bounded local filesystem checks and a small YAML state file, with tests guarding fast deterministic behavior."
    - name: "Idempotency and Retry Safety"
      status: "PASS"
      notes: "Persisting the same active feature repeatedly should be safe and should not corrupt existing specs or retry state."
    - name: "Command Template Independence"
      status: "PASS"
      notes: "No command template changes are required; if templates are touched, they remain agent-neutral and receive explicit injected context."
    - name: "Configuration Consistency"
      status: "PASS"
