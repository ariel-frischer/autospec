feature:
  branch: "138-fix-claude-diagnostics"
  created: "2026-08-23"
  status: "Draft"
  input: "Fix Claude skill-directory preflight and authentication diagnostics"

user_stories:
  - id: "US-001"
    title: "Diagnose Claude setup failures"
    priority: "P1"
    as_a: "developer using Claude Code with Autospec"
    i_want: "preflight and initialization to distinguish skill-directory and authentication failures"
    so_that: "I can apply the correct local remediation without exposing credentials or making a live provider request"
    why_this_priority: "Ambiguous setup failures block workflows and can send users toward irrelevant authentication or directory fixes."
    independent_test: "Run deterministic checks for missing, inaccessible, and present Claude skill directories, then render authentication status failures and verify each diagnostic identifies the correct local remediation."
    acceptance_scenarios:
      - given: "A Claude project does not contain .claude/skills"
        when: "workflow preflight runs"
        then: "the result reports the directory as missing and recommends autospec init"
      - given: "The .claude/skills path exists but cannot be inspected"
        when: "workflow preflight runs"
        then: "the result reports an access failure rather than classifying the directory as missing or authentication-related"
      - given: "Claude Code cannot return local authentication status"
        when: "Autospec renders initialization diagnostics"
        then: "the output identifies the failed local status check, provides a safe command to retry, and states that no live provider request was made"

requirements:
  functional:
    - id: "FR-001"
      description: "MUST require .claude/skills only for Claude-configured workflow preflight."
      acceptance_criteria: "Claude preflight checks .claude/skills while Codex, Jcode, OpenCode, and other agents retain agent-neutral directory requirements."
    - id: "FR-002"
      description: "MUST distinguish a missing Claude skill directory from a filesystem error that makes the path inaccessible."
      acceptance_criteria: "Deterministic tests separately assert missing and permission-denied outcomes, and inaccessible paths appear in failed checks rather than MissingDirs."
    - id: "FR-003"
      description: "MUST use the local claude auth status --json command as the authoritative authentication diagnostic when Claude Code is installed."
      acceptance_criteria: "Tests cover valid OAuth, logged-out, malformed, and command-failure responses without invoking the real Claude CLI."
    - id: "FR-004"
      description: "MUST provide actionable remediation when local Claude authentication status cannot be read."
      acceptance_criteria: "Rendered output tells users to retry claude auth status --json directly and clarifies that no live provider request was made."
    - id: "FR-005"
      description: "MUST NOT print credential values, tokens, or provider secrets in diagnostics."
      acceptance_criteria: "Tests use synthetic errors and output assertions contain only status, command, and remediation text."
    - id: "FR-006"
      description: "MUST preserve fallback detection from local OAuth credentials and ANTHROPIC_API_KEY presence when the local status command is unavailable."
      acceptance_criteria: "Existing deterministic authentication detection tests continue to pass."
    - id: "FR-007"
      description: "MUST pass make test, make fmt, make lint, and make build."
      acceptance_criteria: "All four repository validation commands exit with status 0."
  non_functional:
    - id: "NFR-001"
      category: "code_quality"
      description: "New and materially changed functions MUST remain under 40 lines."
      measurable_target: "Every changed function is fewer than 40 lines."
    - id: "NFR-002"
      category: "code_quality"
      description: "Propagated errors MUST be wrapped with operation context."
      measurable_target: "Every new non-test error includes the failed operation and wraps the original error."
    - id: "NFR-003"
      category: "code_quality"
      description: "Go behavior matrices MUST use map-based table tests."
      measurable_target: "New table-driven tests use map[string]struct cases."
    - id: "NFR-004"
      category: "code_quality"
      description: "Filesystem and command boundaries SHOULD accept injected functions where deterministic testing requires them and return concrete results."
      measurable_target: "Permission and output behavior is tested without real filesystem permission changes, agent CLIs, or external APIs."

success_criteria:
  - id: "SC-001"
    description: "Every tested Claude skill-directory state produces the correct distinct result."
    metric: "Expected outcome match across missing, inaccessible, and present directory cases"
    target: "100%"
  - id: "SC-002"
    description: "Authentication command failures provide a directly runnable local diagnostic without exposing secrets."
    metric: "Required remediation and safety statements present in rendered output"
    target: "100% of command-failure cases"
  - id: "SC-003"
    description: "Shared preflight behavior remains unchanged for non-Claude agents."
    metric: "Existing Codex, Jcode, and cross-agent preflight tests passing"
    target: "100%"
  - id: "SC-004"
    description: "The repository quality gates remain green."
    metric: "Required validation commands completing successfully"
    target: "make test, make fmt, make lint, and make build all exit 0"

edge_cases:
  - scenario: "The skill path returns a permission or I/O error instead of not-exist."
    expected_behavior: "Preflight reports a contextual access failure and does not recommend recreating the path as if it were missing."
  - scenario: "claude auth status returns malformed JSON."
    expected_behavior: "Autospec reports that local status parsing failed, preserves safe fallback detection, and exposes no response credentials."
  - scenario: "OAuth fallback is available while the status command fails."
    expected_behavior: "Autospec may still classify the user as authenticated while separately warning that the authoritative local status command was unavailable."

assumptions:
  - "Claude Code project skills are installed under .claude/skills."
  - "The local Claude CLI owns authentication and credential storage."
  - "No official Jcode Go SDK or third-party Go package behavior is part of this Claude-specific fix."

constraints:
  - "Do not invoke real agent CLIs or external AI APIs in automated tests."
  - "Do not expose credentials or inspect provider quota through live requests."
  - "Preserve agent-aware preflight behavior for Jcode and all non-Claude agents."

out_of_scope:
  - "Changing Jcode CLI or SDK integration behavior."
  - "Changing Claude credential storage or login flows."
  - "Redesigning shared workflow orchestration."

