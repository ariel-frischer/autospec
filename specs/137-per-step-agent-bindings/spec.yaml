feature:
  branch: "137-per-step-agent-bindings"
  created: "2026-08-06"
  status: "Draft"
  input: "Support per-step agent driver, provider, and model in workflows. Add optional driver/provider fields to authored and compiled agent stages, seal per-step bindings keyed by step or role with run-level defaults when omitted, preserve sealed digest and restart fail-closed behavior, support mixed jcode/openai implementation and jcode/anthropic review workflows, and render each step's selection in approval output. Do not add secrets, executable discovery or fallback, or role contract changes."

user_stories:
  - id: "US-001"
    title: "Select an agent per workflow step"
    priority: "P1"
    as_a: "workflow author"
    i_want: "to optionally specify a driver, provider, and model for individual implementation or review steps, using a role-based binding when a step-specific binding is not present"
    so_that: "one workflow can intentionally use different supported agents for different steps without changing the workflow's role contracts"
    why_this_priority: "Per-step selection is the primary capability and is required for mixed-agent workflows."
    independent_test: "Author a workflow containing implementation and review steps with different bindings, compile it, and verify each step resolves to its requested selection."
    acceptance_scenarios:
      - given: "an authored workflow has an implementation step bound to jcode/openai and a review step bound to jcode/anthropic"
        when: "the workflow is compiled and prepared for approval"
        then: "the implementation and review steps retain their respective driver, provider, and model selections"
      - given: "an authored workflow omits a per-step binding"
        when: "the step is resolved"
        then: "the applicable role binding or run-level default supplies the omitted selection without changing the step's role contract"

  - id: "US-002"
    title: "Approve a transparent agent plan"
    priority: "P1"
    as_a: "workflow approver"
    i_want: "to see the resolved driver, provider, and model for every workflow step in approval output"
    so_that: "I can verify mixed-agent execution before approving the run"
    why_this_priority: "Approval must expose the exact execution plan to prevent an unintentionally different agent from running."
    independent_test: "Render approval output for a workflow with multiple selections and verify every step includes its resolved selection."
    acceptance_scenarios:
      - given: "a compiled workflow contains steps with both explicit bindings and inherited defaults"
        when: "approval output is rendered"
        then: "each step displays the final driver, provider, and model that will be used"

  - id: "US-003"
    title: "Resume only the sealed agent plan"
    priority: "P0"
    as_a: "workflow operator"
    i_want: "a resumed workflow to use the same sealed per-step bindings or stop safely when the sealed plan is unavailable or altered"
    so_that: "restarts cannot silently switch agents or models"
    why_this_priority: "Fail-closed restart behavior protects execution integrity and is a stated non-negotiable constraint."
    independent_test: "Start a run, capture its sealed digest, restart with unchanged and changed binding inputs, and verify unchanged inputs resume while changed or missing sealed data is rejected."
    acceptance_scenarios:
      - given: "a run has a sealed binding set and matching digest"
        when: "the run restarts"
        then: "the saved bindings are reused for every step"
      - given: "the sealed binding set is missing, does not match its digest, or differs from the run's original binding inputs"
        when: "the run restarts"
        then: "the run fails closed before agent execution and reports the binding integrity failure"

requirements:
  functional:
    - id: "FR-001"
      description: "MUST allow authored agent stages to specify optional driver and provider fields alongside the existing per-step model selection without changing the stage's role contract."
      acceptance_criteria: "Author and parse stages with omitted and populated driver/provider fields; both forms validate, and existing role inputs and outputs remain unchanged."
    - id: "FR-002"
      description: "MUST carry optional driver and provider fields into compiled agent stages while preserving the authored values and the existing model selection."
      acceptance_criteria: "Compile representative authored stages and compare the compiled stage selections with the authored selections, including omitted optional fields."
    - id: "FR-003"
      description: "MUST resolve each executable workflow step from a binding keyed by step or role, using a run-level default for every selection field omitted by the more specific binding."
      acceptance_criteria: "Resolve workflows covering step-keyed bindings, role-keyed bindings, omitted bindings, and partial bindings; each resolved step has the expected driver, provider, and model."
    - id: "FR-004"
      description: "MUST apply a deterministic precedence order in which a step-keyed binding overrides a role-keyed binding, which overrides the run-level default, for each field independently."
      acceptance_criteria: "Provide conflicting step, role, and run-level values and verify the same precedence is applied consistently to driver, provider, and model."
    - id: "FR-005"
      description: "MUST reject an unresolved, malformed, or unsupported per-step selection before approval or agent execution, with an actionable validation error."
      acceptance_criteria: "Exercise missing required selection data, invalid binding keys, and unsupported driver/provider/model combinations; each case is rejected before an executor is invoked."
    - id: "FR-006"
      description: "MUST seal the fully resolved per-step binding set before execution and persist a digest that represents the exact ordered step selections used by the run."
      acceptance_criteria: "Create a run with multiple resolved steps and verify the persisted sealed data contains every step selection and a reproducible digest."
    - id: "FR-007"
      description: "MUST preserve sealed bindings and their digest across restart, and MUST fail closed when the sealed data is absent, tampered with, or inconsistent with the digest."
      acceptance_criteria: "Restart runs with intact, missing, modified, and digest-mismatched sealed data; only intact data may proceed to agent execution."
    - id: "FR-008"
      description: "MUST support a mixed workflow whose implementation steps resolve to jcode/openai while review steps resolve to jcode/anthropic, including distinct models where specified."
      acceptance_criteria: "Run a deterministic mock workflow with both step classes and verify the executor receives the expected selection for each step in order."
    - id: "FR-009"
      description: "MUST render each workflow step's final driver, provider, and model selection in approval output, including selections inherited from defaults."
      acceptance_criteria: "Render approval output for explicit, role-inherited, and run-default selections and verify every step has an unambiguous displayed selection."
    - id: "FR-010"
      description: "MUST not discover executables, add fallback behavior, or silently substitute a driver, provider, or model when a requested selection cannot be used."
      acceptance_criteria: "Test unavailable and unsupported selections and verify the workflow reports an error without executable discovery, fallback invocation, or agent execution."
    - id: "FR-011"
      description: "MUST not place secrets or credentials in authored stages, compiled stages, sealed binding data, digests, errors, or approval output."
      acceptance_criteria: "Inspect all persisted and rendered binding artifacts using representative credential-like inputs and verify secret material is neither accepted as binding data nor emitted."
    - id: "FR-012"
      description: "MUST preserve existing workflows that provide only run-level agent configuration, resolving all steps to the existing run-level behavior."
      acceptance_criteria: "Compile and execute an existing-style workflow without per-step fields and verify its selections and role behavior are unchanged."
    - id: "FR-013"
      description: "MUST require successful completion of make test, make fmt, make lint, and make build before the feature is considered complete."
      acceptance_criteria: "Run all four repository validation commands and verify each exits successfully."
  non_functional:
    - id: "NFR-001"
      category: "reliability"
      description: "Sealed binding resolution and restart verification must be deterministic and fail closed on integrity uncertainty."
      measurable_target: "100% of repeated tests with identical inputs produce the same digest and step selections; 100% of missing or mismatched seal cases block execution."
    - id: "NFR-002"
      category: "security"
      description: "Binding artifacts and approval output must contain only non-secret selection metadata."
      measurable_target: "0 credential or secret values emitted across authored, compiled, sealed, error, and approval-output test fixtures."
    - id: "NFR-003"
      category: "usability"
      description: "Approval output must make the selection used by every step understandable without inspecting internal files."
      measurable_target: "100% of rendered executable steps show driver, provider, and model in the approval view."
    - id: "NFR-004"
      category: "code_quality"
      description: "Functions should remain under 40 lines."
      measurable_target: "100% of newly added or modified production functions are fewer than 40 lines."
    - id: "NFR-005"
      category: "code_quality"
      description: "Errors must be wrapped with context when crossing operation boundaries."
      measurable_target: "100% of newly added production error returns include operation context, except documented pass-through helpers."
    - id: "NFR-006"
      category: "code_quality"
      description: "Go logic tests must use map-based table tests for scenario coverage."
      measurable_target: "100% of new table-driven Go tests use map[string]struct cases where multiple cases are applicable."
    - id: "NFR-007"
      category: "code_quality"
      description: "Agent and workflow boundaries must accept interfaces and return concrete implementation values."
      measurable_target: "100% of new agent/workflow boundary APIs follow the repository interface-input and concrete-output convention."

success_criteria:
  measurable_outcomes:
    - id: "SC-001"
      description: "Workflow authors can configure different supported agent selections for implementation and review steps in one workflow."
      metric: "Mixed implementation/review workflow scenarios completed without changing role contracts"
      target: "At least 1 end-to-end deterministic scenario passes with jcode/openai implementation and jcode/anthropic review selections."
    - id: "SC-002"
      description: "Approvers can identify the exact agent selection for every executable step before approval."
      metric: "Executable steps with complete displayed selections"
      target: "100% of executable steps display driver, provider, and model."
    - id: "SC-003"
      description: "Restarts never silently change a run's agent selection."
      metric: "Tampered, missing, and unchanged seal restart outcomes"
      target: "All intact seals resume with the original selections, and all altered or missing seals are blocked before execution."
    - id: "SC-004"
      description: "Existing run-default-only workflows continue to behave as before."
      metric: "Regression scenarios using workflows without per-step bindings"
      target: "100% of existing-style compatibility scenarios preserve their previous selections and outcomes."

key_entities:
  - name: "Authored agent stage"
    description: "A user-authored workflow stage that may provide optional per-step agent selection metadata."
    attributes:
      - "step or role key"
      - "optional driver"
      - "optional provider"
      - "model"
  - name: "Compiled agent stage"
    description: "The normalized workflow stage used for execution after authored configuration is compiled."
    attributes:
      - "resolved stage identity"
      - "selection metadata"
      - "role contract"
  - name: "Sealed binding set"
    description: "The immutable per-step driver, provider, and model selections committed to a run before execution."
    attributes:
      - "ordered step bindings"
      - "source precedence"
      - "sealed digest"
  - name: "Run-level default"
    description: "The fallback selection supplied for fields omitted by step- or role-specific bindings."
    attributes:
      - "driver"
      - "provider"
      - "model"

edge_cases:
  - scenario: "A step-specific binding and role-specific binding both provide different values for the same selection field."
    expected_behavior: "The step-specific value wins deterministically, while other omitted fields continue through role and run-level resolution."
  - scenario: "A binding references a step or role that does not exist in the compiled workflow."
    expected_behavior: "Validation rejects the binding before approval or execution and does not silently ignore it."
  - scenario: "A provider or model is omitted at one level but present at a less specific level."
    expected_behavior: "Only the omitted field inherits from the next applicable level; explicitly supplied fields remain unchanged."
  - scenario: "The seal exists but its digest does not match the serialized binding set after restart."
    expected_behavior: "The run fails closed before invoking any agent."
  - scenario: "A legacy workflow has no per-step bindings."
    expected_behavior: "All steps use the existing run-level configuration with no behavior change."

assumptions:
  - "The existing run-level driver, provider, and model configuration remains the default source when no more specific value is supplied."
  - "Step-keyed bindings take precedence over role-keyed bindings, and each selection field resolves independently."
  - "Only already supported driver, provider, and model combinations are valid; this feature does not expand the supported agent catalog."
  - "The existing model field remains available to authored and compiled stages; driver and provider are the newly optional stage fields."
  - "Approval output may display non-secret identifiers and selection metadata but never credentials or executable paths."

constraints:
  - "Do not add secrets, credentials, or secret transport to workflow artifacts or output."
  - "Do not add executable discovery or fallback behavior."
  - "Do not change agent role contracts, step inputs, step outputs, or review semantics."
  - "Preserve the sealed digest and fail-closed restart behavior for all existing run recovery paths."
  - "Use deterministic mock-based tests rather than real agent CLIs or external AI APIs."

out_of_scope:
  - "Adding new agent drivers, providers, models, or credentials."
  - "Changing role contracts or redefining implementation and review responsibilities."
  - "Automatic executable lookup, provider discovery, or fallback selection."
  - "Changing the run-level configuration model beyond using it as the default for omitted per-step fields."
  - "Live integration testing against jcode, OpenAI, or Anthropic services."

