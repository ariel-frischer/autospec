      title: "Setup"
      purpose: "Confirm the installed SDK contract and repository seams before changing lifecycle behavior."
      tasks:
        - id: "T001"
          title: "Inspect jcode-go v0.1.1 safe-run lifecycle APIs and record connect, launch, readiness, session, event, and close seams"
          status: "Completed"
          implementation_notes: >-
            Inspected github.com/ariel-frischer/jcode-go v0.1.1. Shared connect uses jcode.Connect(ctx, ConnectOptions) and never starts or stops a process; private startup uses jcode.Launch(ctx, LaunchOptions), or jcode.LaunchInstance(LaunchOptions) for an explicit Instance ownership handle. Client.State exposes connecting, connected, disconnected, reconnecting, closing, and closed; Client.Reconnect(ctx) is explicit and bounded by Options.Reconnect. Client.Close is idempotent. Session creation uses Client.CreateSession, prompt execution uses Session.Send, events use Session.Events and TypedEventStream.Next, with TurnDone as completion and typed disconnect errors from the stream. Instance has Shutdown and Close for private cleanup. The SDK has no separate readiness method; successful Connect/Launch/NewClient handshake is the readiness boundary, so the local adapter must hide state/error classification behind interfaces. Provider protocol and auth remain SDK-owned.
          type: "setup"
          parallel: false
          story_id: null
          file_path: "internal/cliagent/jcode.go"
          dependencies: []
          acceptance_criteria:
            - "The task records the exact SDK methods and typed outcomes available for shared connect, private launch, readiness, disconnect, session, event-stream, and cleanup handling."
            - "The selected seam preserves jcode protocol and provider-authentication ownership and identifies any missing signal that must be hidden behind a local interface."
        - id: "T002"
          title: "Inventory existing jcode configuration, lifecycle wrappers, test doubles, and E2E fixture conventions"
          status: "Completed"
          implementation_notes: >-
            Existing seams are internal/config/jcode.go and Configuration.Jcode, loaded with environment > selected profile > project > user > defaults precedence. Native construction is Configuration.GetAgent, while workflow commands use lifecycle.RunWithHistory or its context-aware variant. Deterministic native-agent tests use cliagent.jcodeFactory, jcodeClient, jcodeSession, and jcodeEventStream fakes in internal/cliagent/jcode_test.go. Temporary directories and built-binary isolation are provided by t.TempDir and internal/testutil.E2EEnv. Planned changes stay within config and cliagent plus focused tests and docs; command templates, provider credentials, and daemon state storage are not part of the integration.
          type: "setup"
          parallel: true
          story_id: null
          file_path: "internal/config/jcode.go"
          dependencies: []
          acceptance_criteria:
            - "The inventory names the effective configuration precedence, profile overlay, lifecycle wrapper, mock, temporary-directory, and built-binary test seams used by the implementation."
            - "The inventory confirms the exact files that must change without adding command-template or credential-storage behavior."
