# GoReleaser configuration for autospec
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go mod download
    # Tests run in dedicated CI step before goreleaser (release.yml:test job)
    # Running here causes flaky failures due to goreleaser's working directory context

builds:
  - id: autospec
    binary: autospec
    main: ./cmd/autospec
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Set version in internal/build (used for dev gating via IsDevBuild/MultiAgentEnabled)
      - -X github.com/ariel-frischer/autospec/internal/build.Version={{.Version}}
      - -X github.com/ariel-frischer/autospec/internal/build.Commit={{.ShortCommit}}
      - -X github.com/ariel-frischer/autospec/internal/build.BuildDate={{.Date}}
      # Set version in internal/version (canonical version for display and prereqs)
      - -X github.com/ariel-frischer/autospec/internal/version.Version={{.Version}}
      - -X github.com/ariel-frischer/autospec/internal/version.Commit={{.ShortCommit}}
      - -X github.com/ariel-frischer/autospec/internal/version.BuildDate={{.Date}}

archives:
  - id: autospec-archive
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Changelog disabled - release notes are generated by release.yml using chlog.
changelog:
  disable: true

release:
  github:
    owner: ariel-frischer
    name: autospec
  draft: false
  prerelease: auto
  mode: replace

